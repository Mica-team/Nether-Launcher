name: Nether Launcher Test Build

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Free up disk space
        run: |
          sudo apt-get clean
          rm -rf ~/.gradle/caches ~/.gradle/wrapper/dists
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Turnip
        continue-on-error: true
        run: |
          mkdir -p app_pojavlauncher/src/main/jniLibs/arm64-v8a
          curl -L "https://github.com/Mica-team/freedreno_turnip-CI/releases/download/github_run/libvulkan_freedreno.so" -o app_pojavlauncher/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so
          ls -lh app_pojavlauncher/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APKs
        run: |
          mkdir -p out
          gradle :app_pojavlauncher:assembleFullDebug
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/NetherLauncher-debug-full.apk
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/NetherLauncher-debug-noruntime.apk

      - name: Get Legacy Zink
        run: git clone https://github.com/Mica-team/ZinkPlugin.git ZinkPlugin

      - name: Build Legacy Zink
        continue-on-error: true
        working-directory: ZinkPlugin
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then cp app/build/outputs/apk/debug/app-debug.apk ../out/NetherLauncher-ZinkPlugin-debug.apk; fi

      - name: Generate checksums
        run: |
          md5sum out/NetherLauncher-debug-full.apk > out/NetherLauncher-debug-full.md5
          md5sum out/NetherLauncher-debug-noruntime.apk > out/NetherLauncher-debug-noruntime.md5
          if [ -f out/NetherLauncher-ZinkPlugin-debug.apk ]; then md5sum out/NetherLauncher-ZinkPlugin-debug.apk > out/NetherLauncher-ZinkPlugin-debug.md5; fi

      - name: Create ZIP
        run: |
          cd out
          zip NetherLauncher-with-Legacy-Zink.zip NetherLauncher-debug-full.apk NetherLauncher-debug-noruntime.apk
          [ -f NetherLauncher-ZinkPlugin-debug.apk ] && zip NetherLauncher-with-Legacy-Zink.zip NetherLauncher-ZinkPlugin-debug.apk

      - name: Upload Full Debug
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-debug-full
          path: |
            out/NetherLauncher-debug-full.apk
            out/NetherLauncher-debug-full.md5

      - name: Upload No Runtime
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-debug-noruntime
          path: |
            out/NetherLauncher-debug-noruntime.apk
            out/NetherLauncher-debug-noruntime.md5

      - name: Upload Legacy Zink
        if: ${{ hashFiles('out/NetherLauncher-ZinkPlugin-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-Legacy-Zink
          path: |
            out/NetherLauncher-ZinkPlugin-debug.apk
            out/NetherLauncher-ZinkPlugin-debug.md5

      - name: Upload Combined ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-with-Legacy-Zink
          path: out/NetherLauncher-with-Legacy-Zink.zip
