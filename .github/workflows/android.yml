name: Nether Launcher Debug Build

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Free up disk space
        run: |
          sudo apt-get clean
          rm -rf ~/.gradle/caches ~/.gradle/wrapper/dists
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Turnip
        continue-on-error: true
        run: |
          mkdir -p app_pojavlauncher/src/main/jniLibs/arm64-v8a
          curl -L "https://github.com/Mica-team/freedreno_turnip-CI/releases/download/github_run/libvulkan_freedreno.so" -o app_pojavlauncher/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so
          ls -lh app_pojavlauncher/src/main/jniLibs/arm64-v8a/libvulkan_freedreno.so

      - name: Get Mesa (arm32)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: Mica-team/mesa
          workflow: android.yml
          workflow_conclusion: success
          branch: 21.2-virgl
          name: libzink_arm32
          path: app_pojavlauncher/libs/mesa/arm32

      - name: Get Mesa (arm64)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: Mica-team/mesa
          workflow: android.yml
          workflow_conclusion: success
          branch: 21.2-virgl
          name: libzink_aarch64
          path: app_pojavlauncher/libs/mesa/arm64

      - name: Get Mesa (x86_64)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: Mica-team/mesa
          workflow: android.yml
          workflow_conclusion: success
          branch: 21.2-virgl
          name: libzink_x86_64
          path: app_pojavlauncher/libs/mesa/x86_64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug APKs
        run: |
          set -e
          mkdir -p out

          gradle :app_pojavlauncher:assembleFullDebug
          FULL_APK=$(find app_pojavlauncher/build/outputs/apk/full/debug -type f -name '*.apk' -print -quit)
          test -n "$FULL_APK"
          cp "$FULL_APK" out/NetherLauncher-debug-full.apk

          gradle :app_pojavlauncher:assembleNoruntimeDebug
          NORUNTIME_APK=$(find app_pojavlauncher/build/outputs/apk/noruntime/debug -type f -name '*.apk' -print -quit)
          test -n "$NORUNTIME_APK"
          cp "$NORUNTIME_APK" out/NetherLauncher-debug-noruntime.apk

      - name: Generate checksums
        run: |
          md5sum out/NetherLauncher-debug-full.apk > out/NetherLauncher-debug-full.md5
          md5sum out/NetherLauncher-debug-noruntime.apk > out/NetherLauncher-debug-noruntime.md5

      - name: Upload Full Debug
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-debug-full
          path: |
            out/NetherLauncher-debug-full.apk
            out/NetherLauncher-debug-full.md5

      - name: Upload No Runtime Debug
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-debug-noruntime
          path: |
            out/NetherLauncher-debug-noruntime.apk
            out/NetherLauncher-debug-noruntime.md5
