name: Nether Launcher Test Build

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      # ==========================================
      # Free up disk space
      # ==========================================
      - name: Free up disk space
        run: |
          echo "========== DISK SPACE BEFORE =========="
          df -h

          echo "Removing unnecessary preinstalled software..."

          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/cmake
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "Cleaning package cache..."
          sudo apt-get clean

          echo "Cleaning Gradle caches..."
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper/dists

          echo "Cleaning temporary files..."
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*

          echo "========== DISK SPACE AFTER =========="
          df -h

      # ==========================================
      # Get LTW
      # ==========================================
      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      # ==========================================
      # Get Turnip / Freedreno Vulkan driver
      # ==========================================
      - name: Get Turnip
        run: |
          mkdir -p app_pojavlauncher/turnip

          curl -L \
            "https://github.com/Mica-team/freedreno_turnip-CI/releases/download/github_run/turnip_adrenotools.zip" \
            -o /tmp/turnip.zip

          unzip -o /tmp/turnip.zip \
            vulkan.freedreno.so \
            -d app_pojavlauncher/turnip

          echo "Turnip library:"
          ls -lh app_pojavlauncher/turnip/vulkan.freedreno.so

          rm -f /tmp/turnip.zip

      # ==========================================
      # Set up Gradle
      # ==========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # ==========================================
      # Set up Java 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # Create output directory
      # ==========================================
      - name: Create output directory
        run: |
          mkdir -p out

      # ==========================================
      # Build Nether Launcher - Full Debug
      # ==========================================
      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleFullDebug

          mv \
            app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk \
            out/NetherLauncher-debug-full.apk

      # ==========================================
      # Build Nether Launcher - No Runtime Debug
      # ==========================================
      - name: Build Debug APK (No Runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug

          mv \
            app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk \
            out/NetherLauncher-debug-noruntime.apk

      # ==========================================
      # Build Legacy Zink Plugin
      # ==========================================
      - name: Build Legacy Zink Plugin
        continue-on-error: true
        working-directory: ZinkPlugin
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp \
              app/build/outputs/apk/debug/app-debug.apk \
              ../out/NetherLauncher-ZinkPlugin-debug.apk

            echo "Legacy Zink plugin built successfully."
          else
            echo "Legacy Zink APK was not produced."
            exit 1
          fi

      # ==========================================
      # Show generated files
      # ==========================================
      - name: List output files
        run: |
          echo "========== OUTPUT =========="
          ls -lh out
          echo "============================"

      # ==========================================
      # Generate MD5 checksums
      # ==========================================
      - name: Generate MD5 checksums
        run: |
          md5sum out/NetherLauncher-debug-full.apk \
            > out/NetherLauncher-debug-full.md5

          md5sum out/NetherLauncher-debug-noruntime.apk \
            > out/NetherLauncher-debug-noruntime.md5

          if [ -f out/NetherLauncher-ZinkPlugin-debug.apk ]; then
            md5sum out/NetherLauncher-ZinkPlugin-debug.apk \
              > out/NetherLauncher-ZinkPlugin-debug.md5
          fi

      # ==========================================
      # Upload Full Debug APK
      # ==========================================
      - name: Upload Nether Launcher Full
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-debug-full
          path: |
            out/NetherLauncher-debug-full.apk
            out/NetherLauncher-debug-full.md5

      # ==========================================
      # Upload No Runtime APK
      # ==========================================
      - name: Upload Nether Launcher No Runtime
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-debug-noruntime
          path: |
            out/NetherLauncher-debug-noruntime.apk
            out/NetherLauncher-debug-noruntime.md5

      # ==========================================
      # Upload Legacy Zink if it built
      # ==========================================
      - name: Upload Legacy Zink Plugin
        if: ${{ hashFiles('out/NetherLauncher-ZinkPlugin-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-Legacy-Zink
          path: |
            out/NetherLauncher-ZinkPlugin-debug.apk
            out/NetherLauncher-ZinkPlugin-debug.md5
