name: Nether Launcher Debug Build

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Free up disk space
        run: |
          sudo apt-get clean
          rm -rf ~/.gradle/caches ~/.gradle/wrapper/dists
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Turnip (Freedreno Vulkan driver)
        run: |
          set -eu
          DRIVER_DIR="app_pojavlauncher/src/main/jniLibs/arm64-v8a"
          DRIVER_URL="https://github.com/Mica-team/freedreno_turnip-CI/releases/download/github_run/libvulkan_freedreno.so"
          mkdir -p "$DRIVER_DIR"
          curl -fL --retry 3 --retry-delay 2 "$DRIVER_URL" -o "$DRIVER_DIR/libvulkan_freedreno.so"
          test -s "$DRIVER_DIR/libvulkan_freedreno.so"
          file "$DRIVER_DIR/libvulkan_freedreno.so"
          ls -lh "$DRIVER_DIR/libvulkan_freedreno.so"

      - name: Get Mesa Zink (without token)
        continue-on-error: true
        run: |
          set -eu
          BASE="https://github.com/Mica-team/mesa/releases/download/mesa-zink-latest"
          mkdir -p app_pojavlauncher/libs/mesa/arm32 app_pojavlauncher/libs/mesa/arm64 app_pojavlauncher/libs/mesa/x86_64
          curl -fL --retry 3 "$BASE/mesa-zink-arm32.zip" -o /tmp/mesa-zink-arm32.zip
          curl -fL --retry 3 "$BASE/mesa-zink-aarch64.zip" -o /tmp/mesa-zink-aarch64.zip
          curl -fL --retry 3 "$BASE/mesa-zink-x86_64.zip" -o /tmp/mesa-zink-x86_64.zip
          unzip -oq /tmp/mesa-zink-arm32.zip -d app_pojavlauncher/libs/mesa/arm32
          unzip -oq /tmp/mesa-zink-aarch64.zip -d app_pojavlauncher/libs/mesa/arm64
          unzip -oq /tmp/mesa-zink-x86_64.zip -d app_pojavlauncher/libs/mesa/x86_64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug APKs
        run: |
          set -e
          mkdir -p out

          gradle :app_pojavlauncher:assembleFullDebug
          FULL_APK=$(find app_pojavlauncher/build/outputs/apk/full/debug -type f -name '*.apk' -print -quit)
          test -n "$FULL_APK"
          cp "$FULL_APK" out/NetherLauncher-debug-full.apk

          gradle :app_pojavlauncher:assembleNoruntimeDebug
          NORUNTIME_APK=$(find app_pojavlauncher/build/outputs/apk/noruntime/debug -type f -name '*.apk' -print -quit)
          test -n "$NORUNTIME_APK"
          cp "$NORUNTIME_APK" out/NetherLauncher-debug-noruntime.apk

      - name: Generate checksums
        run: |
          md5sum out/NetherLauncher-debug-full.apk > out/NetherLauncher-debug-full.md5
          md5sum out/NetherLauncher-debug-noruntime.apk > out/NetherLauncher-debug-noruntime.md5

      - name: Upload Full Debug
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-debug-full
          path: |
            out/NetherLauncher-debug-full.apk
            out/NetherLauncher-debug-full.md5

      - name: Upload No Runtime Debug
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-debug-noruntime
          path: |
            out/NetherLauncher-debug-noruntime.apk
            out/NetherLauncher-debug-noruntime.md5
