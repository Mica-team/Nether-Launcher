name: Nether Launcher Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create output directory
        run: mkdir -p out

      - name: Build Publishing AAB
        if: github.repository_owner == 'Mica-team' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleFullGplay
          mv app_pojavlauncher/build/outputs/bundle/fullGplay/app_pojavlauncher-full-gplay.aab out/NetherLauncher-gplay.aab

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleFullDebug
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/NetherLauncher-debug-full.apk

      - name: Build Debug APK (No Runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/NetherLauncher-debug-noruntime.apk

      - name: Build Nightly Release APK
        if: github.repository_owner == 'Mica-team' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:assembleFullPubRelease
          mv app_pojavlauncher/build/outputs/apk/full/pubRelease/app_pojavlauncher-full-pubRelease.apk out/NetherLauncher-release.apk

      - name: Generate MD5 checksums
        run: |
          md5sum out/NetherLauncher-debug-full.apk > out/NetherLauncher-debug-full.md5
          md5sum out/NetherLauncher-debug-noruntime.apk > out/NetherLauncher-debug-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-debug
          path: out/NetherLauncher-debug-full.apk

      - name: Upload Debug APK (No Runtime)
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-debug-noruntime
          path: out/NetherLauncher-debug-noruntime.apk

      - name: Release Nether Launcher Nightly
        if: github.repository_owner == 'Mica-team' && github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: Nether Launcher Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            Nether Launcher nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/NetherLauncher-release.apk

      - name: Upload AAB
        if: github.repository_owner == 'Mica-team' && github.ref_name == 'v3_openjdk'
        uses: actions/upload-artifact@v4
        with:
          name: NetherLauncher-release-aab
          path: out/NetherLauncher-gplay.aab

      - name: Upload to Google Play Testing Track
        continue-on-error: true
        if: github.repository_owner == 'Mica-team' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: git.artdeell.mjlaunch
          releaseFiles: out/NetherLauncher-gplay.aab
          track: internal
          inAppUpdatePriority: 5
