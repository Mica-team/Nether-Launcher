name: Build Mesa Android

on:
  workflow_dispatch:

jobs:
  build-mesa:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Nether Launcher
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            ninja-build \
            patchelf \
            unzip \
            curl \
            flex \
            bison \
            pkg-config \
            glslang-tools \
            glslang-dev \
            libdrm-dev \
            libexpat1-dev \
            libudev-dev \
            libwayland-dev \
            wayland-protocols

      - name: Install modern Meson
        run: |
          python3 -m pip install --user --upgrade \
            "meson>=1.1.0" \
            mako

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.local/bin:$PATH"

          echo "Meson version:"
          meson --version

          python3 -m mesonbuild.mesonmain --version

      - name: Install Android NDK r29
        run: |
          mkdir -p "$HOME/android-ndk"

          curl -L \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip \
            -o "$HOME/android-ndk/ndk.zip"

          unzip -q \
            "$HOME/android-ndk/ndk.zip" \
            -d "$HOME/android-ndk"

      - name: Clone Mesa fork
        run: |
          git clone \
            --depth 1 \
            https://github.com/Mica-team/mesa.git \
            mesa

          cd mesa

          echo "Mesa commit:"
          git rev-parse HEAD

      - name: Build Mesa for Android ARM64
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          cd mesa

          NDK="$HOME/android-ndk/android-ndk-r29"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p build-bin

          ln -sf "$TOOLCHAIN/bin/clang" build-bin/cc
          ln -sf "$TOOLCHAIN/bin/clang++" build-bin/c++

          export PATH="$PWD/build-bin:$TOOLCHAIN/bin:$PATH"

          export CC=clang
          export CXX=clang++
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export STRIP=llvm-strip
          export OBJDUMP=llvm-objdump
          export OBJCOPY=llvm-objcopy

          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$TOOLCHAIN/bin/llvm-ar'
          c = '$TOOLCHAIN/bin/aarch64-linux-android34-clang'
          cpp = '$TOOLCHAIN/bin/aarch64-linux-android34-clang++'
          c_ld = '$TOOLCHAIN/bin/ld.lld'
          cpp_ld = '$TOOLCHAIN/bin/ld.lld'
          strip = '$TOOLCHAIN/bin/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=$TOOLCHAIN/lib/pkgconfig', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat > native.txt <<EOF
          [binaries]
          c = 'clang'
          cpp = 'clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          c_ld = 'ld.lld'
          cpp_ld = 'ld.lld'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

          meson setup build-android-aarch64 \
            --cross-file android-aarch64.txt \
            --native-file native.txt \
            --prefix "$PWD/install" \
            --buildtype release \
            -Db_lto=true \
            -Db_lto_mode=thin \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=34 \
            -Dandroid-stub=true \
            -Dvideo-codecs= \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled

          ninja -C build-android-aarch64 install

      - name: Verify Mesa output
        run: |
          find mesa/install -type f -name "*.so" -exec ls -lh {} \;

          echo "Checking for Freedreno Vulkan driver..."

          if find mesa/install -name "libvulkan_freedreno.so" | grep -q .; then
            echo "Freedreno Vulkan driver built successfully!"
          else
            echo "ERROR: libvulkan_freedreno.so was not produced."
            exit 1
          fi

      - name: Upload Mesa libraries
        uses: actions/upload-artifact@v4
        with:
          name: mesa-android-arm64
          path: |
            mesa/install/**/*.so
            mesa/build-android-aarch64/meson-logs/meson-log.txt
