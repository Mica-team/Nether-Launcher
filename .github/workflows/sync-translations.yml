name: Sync translations

on:
  push:
    branches:
      - v3_openjdk
    paths:
      - "app_pojavlauncher/src/main/res/values/strings.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Sync translations
        run: python3 scripts/sync_translations.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- app_pojavlauncher/src/main/res/values-*/strings.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synchronized translations
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Nether Translation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_pojavlauncher/src/main/res/values-*/strings.xml
          git commit -m "chore: sync translations"
          git push origin HEAD:v3_openjdk
